---
# Kyverno — admission control in k3s. Baseline policies ENFORCE (no privileged/hostPath); the
# POL-3 / K8S scenarios exploit a deliberate policy gap in the attack layer.
- name: install kyverno {{ versions.kyverno }} (server-side apply; CRDs exceed client-side annotation limit)
  ansible.builtin.shell: >
    k3s kubectl apply --server-side --force-conflicts -f
    https://github.com/kyverno/kyverno/releases/download/{{ versions.kyverno }}/install.yaml
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  register: kyverno_install
  changed_when: true
  retries: 3
  delay: 10
  until: kyverno_install.rc == 0

- name: wait for kyverno admission controller to become available (tolerant; it restarts a few
  # times during first boot while CRDs/webhooks settle — don't fail the playbook on a slow rollout)
  ansible.builtin.shell: k3s kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=120s
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: false
  failed_when: false
  retries: 5
  delay: 20
  until: kyverno_ready.rc == 0
  register: kyverno_ready
