---
# Argo CD — installed into k3s (GitOps tier). NodePort-exposed so players reach it over the VPC.
- name: argocd namespace
  ansible.builtin.shell: k3s kubectl get ns argocd || k3s kubectl create namespace argocd
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  register: ns
  changed_when: "'created' in ns.stdout"

- name: install argocd {{ versions.argocd }}
  ansible.builtin.shell: >
    k3s kubectl apply -n argocd -f
    https://raw.githubusercontent.com/argoproj/argo-cd/{{ versions.argocd }}/manifests/install.yaml
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  register: argo_install
  changed_when: true
  retries: 3
  delay: 10
  until: argo_install.rc == 0

- name: wait for argocd-server rollout
  ansible.builtin.shell: k3s kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: false

- name: expose argocd-server via NodePort
  ansible.builtin.shell: >
    k3s kubectl -n argocd patch svc argocd-server -p
    '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":8080,"nodePort":30080},{"name":"https","port":443,"targetPort":8080,"nodePort":30443}]}}'
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: true

- name: retrieve initial admin password
  ansible.builtin.shell: >
    k3s kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath='{.data.password}' | base64 -d
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  register: argo_pw
  changed_when: false
  failed_when: false

- name: store admin password on host (operator reference)
  ansible.builtin.copy:
    dest: /root/argocd-admin-password
    content: "admin / {{ argo_pw.stdout | default('(fetch argocd-initial-admin-secret)') }}\n"
    mode: "0600"
